<!doctype html>
<html lang="de" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Kontor · Werkbank Unverricht</title>
<meta name="description" content="Alle Werkzeuge von Maik Unverricht auf einen Blick – live als Kacheln.">
<meta name="theme-color" content="#06090E">
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%2032%2032'%3E%3Crect%20width='32'%20height='32'%20rx='8'%20fill='%2306090E'/%3E%3Cg%20transform='translate%2816%2016%29%20scale%280.19%29%20translate%28-60%20-56%29'%3E%3Cpath%20d='M26%2C16%20V62%20A34%2C34%200%200%200%2094%2C62%20V16'%20fill='none'%20stroke='%23EDF0F3'%20stroke-width='22'%20stroke-linecap='round'%20stroke-linejoin='round'/%3E%3Ccircle%20cx='60'%20cy='64'%20r='18.5'%20fill='%23F2B33D'/%3E%3C/g%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..800&family=JetBrains+Mono:wght@400;500&display=swap">
<script>
(function(){var t=null;try{t=localStorage.getItem('wb-cockpit-theme')}catch(e){}
if(t!=='light'&&t!=='dark'){t=window.matchMedia&&matchMedia('(prefers-color-scheme: light)').matches?'light':'dark'}
document.documentElement.setAttribute('data-theme',t);})();
</script>
<style>
:root{
  color-scheme:dark;
  --void:#06090E;
  --bg-grad:linear-gradient(175deg,#070B11 0%,#0A121B 38%,#0C1620 68%,#080C12 100%);
  --glass:rgba(16,22,31,.55);
  --glass-2:rgba(12,17,24,.82);
  --glass-edge:rgba(255,255,255,.10);
  --text:#EDF0F3;--text-2:#9BA6B2;--text-3:#6B7683;
  --line:rgba(255,255,255,.09);
  --line-hi:rgba(242,179,61,.38);
  --amber:#F2B33D;--teal:#63D9C4;
  --em-1:#F2B33D;--em-2:#F7CF83;--em-3:#63D9C4;
  /* Zwei Farben für die neuen Werkzeuge: Blau führt Termine, Kupfer führt Geld.
     Beide gelten auch für ihre Leitungen im Bus. */
  --info:#7FA9F5;--geld:#D9A86C;
  --glow-a:rgba(242,179,61,.10);--glow-t:rgba(99,217,196,.08);
  --shadow:0 18px 46px -22px rgba(0,0,0,.75);
  --shadow-lg:0 30px 80px -30px rgba(0,0,0,.85);
  --display:"Archivo","Helvetica Neue",Arial,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
  --max:1120px;--pad:22px;
  --t-s:.25s;--t-m:.45s;
}
html[data-theme="light"]{
  color-scheme:light;
  --void:#EEF1F6;
  --bg-grad:linear-gradient(175deg,#F5F7FA 0%,#EAEEF4 38%,#E6EBF2 68%,#F2F4F8 100%);
  --glass:rgba(255,255,255,.60);
  --glass-2:rgba(248,250,252,.88);
  --glass-edge:rgba(17,25,35,.10);
  --text:#111923;--text-2:#4A5563;--text-3:#7A8491;
  --line:rgba(17,25,35,.10);
  --line-hi:rgba(224,162,31,.55);
  --amber:#E0A21F;--teal:#2FA894;
  --em-1:#C98A0C;--em-2:#E0A21F;--em-3:#2FA894;
  --info:#3F6FCB;--geld:#A56B2F;
  --glow-a:rgba(224,162,31,.13);--glow-t:rgba(47,168,148,.10);
  --shadow:0 18px 40px -24px rgba(30,40,60,.30);
  --shadow-lg:0 30px 70px -34px rgba(30,40,60,.42);
}
*,*::before,*::after{box-sizing:border-box}
html{scrollbar-gutter:stable;-webkit-text-size-adjust:100%}
html.locked{overflow:hidden;background:var(--void)}
body{margin:0;background:var(--void);color:var(--text);font-family:var(--display);font-size:16px;line-height:1.6;
  -webkit-font-smoothing:antialiased;overflow-x:hidden;transition:background-color .35s ease,color .35s ease}
a{color:inherit}
button{font:inherit;color:inherit}
.mono{font-family:var(--mono)}

/* Hintergrund */
.bg{position:fixed;inset:0;z-index:0;overflow:hidden;pointer-events:none;background:var(--bg-grad)}
.bg i{position:absolute;border-radius:50%;filter:blur(60px)}
.bg .g1{width:620px;height:620px;left:-180px;top:-220px;background:radial-gradient(circle,var(--glow-a),transparent 70%)}
.bg .g2{width:720px;height:720px;right:-260px;top:38%;background:radial-gradient(circle,var(--glow-t),transparent 70%)}
.bg::after{content:"";position:absolute;inset:0;opacity:.5;
  background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);
  background-size:56px 56px;-webkit-mask-image:radial-gradient(ellipse at 50% 0%,#000 0%,transparent 62%);mask-image:radial-gradient(ellipse at 50% 0%,#000 0%,transparent 62%)}

/* Navigation */
.nav{position:fixed;top:0;left:0;right:0;z-index:40;padding:calc(12px + env(safe-area-inset-top)) var(--pad) 0}
.nav-in{max-width:var(--max);margin:0 auto;display:flex;align-items:center;gap:14px;height:52px;padding:0 8px 0 18px;
  border-radius:100px;border:1px solid var(--glass-edge);background:var(--glass);box-shadow:var(--shadow);
  -webkit-backdrop-filter:blur(15px) saturate(1.3);backdrop-filter:blur(15px) saturate(1.3)}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;font-weight:500;letter-spacing:-.01em;white-space:nowrap}
.brand b{font-weight:800;font-variation-settings:'wdth' 112}
.mark{display:inline-flex;align-items:center;justify-content:center;width:21px;height:21px;flex:none;color:var(--text)}
.mark svg{width:100%;height:100%;display:block;overflow:visible}
.nav-r{margin-left:auto;display:flex;align-items:center;gap:8px}
.clock{font-size:12px;color:var(--text-3);letter-spacing:.08em;margin-right:6px}
.pill{display:inline-flex;align-items:center;gap:7px;height:36px;padding:0 14px;border-radius:100px;border:1px solid var(--glass-edge);
  background:transparent;text-decoration:none;font-size:14px;font-weight:500;cursor:pointer;white-space:nowrap;
  transition:background var(--t-s),border-color var(--t-s)}
.pill:hover{background:var(--glass);border-color:var(--line-hi)}
.icon-btn{width:36px;padding:0;justify-content:center}
.pill svg{width:16px;height:16px;flex:none}
:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
.sun{display:none}
html[data-theme="light"] .sun{display:block}
html[data-theme="light"] .moon{display:none}

/* Hero */
main{position:relative;max-width:var(--max);margin:0 auto;padding:0 var(--pad)}
.hero{padding:clamp(104px,14vw,140px) 0 clamp(28px,4vw,40px)}
.eyebrow{font-family:var(--mono);font-size:11.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--text-3);
  display:flex;align-items:center;gap:12px}
.eyebrow::before{content:"";width:28px;height:1px;background:var(--amber)}
h1{font-family:var(--display);font-size:clamp(40px,7.2vw,86px);line-height:.98;letter-spacing:-.045em;margin:22px 0 0;font-weight:700}
h1 span{font-variation-settings:'wdth' 116,'wght' 800}
h1 em{font-style:italic;font-weight:600;background:linear-gradient(94deg,var(--em-1),var(--em-2) 52%,var(--em-3));
  -webkit-background-clip:text;background-clip:text;color:transparent;padding-right:.06em}
.lead{max-width:560px;color:var(--text-2);font-size:clamp(16px,1.9vw,18.5px);margin:22px 0 0}
.stats{display:flex;flex-wrap:wrap;gap:8px 22px;margin-top:28px;font-family:var(--mono);font-size:12.5px;color:var(--text-3)}
.stats b{color:var(--text);font-weight:500}

/* Kacheln */
.grid{position:relative;display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));
  column-gap:18px;row-gap:56px;padding:32px 34px 90px}

/* Bänder: der Arbeitsprozess von links nach rechts, die Werkstatt daneben.
   Die Überschrift läuft über die ganze Breite, damit das Raster darunter
   mehrspaltig bleibt und die Leitungen weiter durch die Lücken passen. */
.gruppe{grid-column:1/-1;position:relative;z-index:1;display:flex;align-items:baseline;gap:14px;
  flex-wrap:wrap;margin:0 0 -26px;padding-top:6px}
.gruppe:first-child,.offen + .gruppe{padding-top:0}
.gruppe:empty{min-height:21px}
.gruppe h2{margin:0;font-size:15px;letter-spacing:-.01em;font-weight:700;font-variation-settings:'wdth' 110;white-space:nowrap}
.gruppe p{margin:0;flex:1;min-width:140px;font-size:13px;color:var(--text-3);line-height:1.45}
.gruppe::before{content:"";position:absolute;left:0;right:0;bottom:-11px;height:1px;background:var(--line)}
/* Die Schrittnummer trägt die Reihenfolge des Prozesses – sie steht kräftiger
   als der Name der Station dahinter. */
.t-idx b{font-weight:600;color:var(--text-2)}

/* Datenbus: die Leitung zwischen den Werkzeugen. Liegt hinter den Kacheln,
   läuft in den Lücken und trägt sichtbare Pakete in Flussrichtung. */
.bus{position:absolute;inset:0;overflow:visible;pointer-events:none;z-index:0;opacity:0;transition:opacity .8s ease}
.bus.on{opacity:1}
body.zoomed .bus{opacity:0}
.bus .trace{fill:none;stroke:var(--bus);stroke-width:1.3;stroke-linecap:round;stroke-linejoin:round;opacity:.38}
.bus .trace.haken{stroke-dasharray:2 7;opacity:.36}
.bus .trace.name{stroke-dasharray:9 6;opacity:.46}
.bus .halo{fill:none;stroke:var(--bus);stroke-width:7;opacity:.05}
.bus .pad{fill:var(--void);stroke:var(--bus);stroke-width:1.4;opacity:.8}
.bus .pkt{fill:var(--bus)}
.bus .aura{fill:var(--bus);opacity:.12}
.bus .hit{fill:none;stroke:transparent;stroke-width:10;pointer-events:stroke;cursor:pointer}
.bus g:hover .trace{opacity:.95;stroke-width:2.2}
.bus g:hover .halo{opacity:.2}

/* Inspektor: was auf dieser Leitung liegt – lesend, nie schreibend */
dialog.bus-dlg{border:0;padding:0;background:transparent;max-width:min(720px,94vw);width:100%;color:var(--text)}
dialog.bus-dlg::backdrop{background:color-mix(in srgb,#04070B 74%,transparent);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
.sheet{border:1px solid var(--glass-edge);border-radius:20px;box-shadow:var(--shadow-lg);
  background:color-mix(in srgb,var(--void) 93%,var(--glass-2));
  -webkit-backdrop-filter:blur(20px) saturate(1.3);backdrop-filter:blur(20px) saturate(1.3);
  max-height:86vh;display:flex;flex-direction:column;overflow:hidden}
.sheet header{display:flex;align-items:center;gap:12px;padding:15px 18px;border-bottom:1px solid var(--line)}
.sheet header h3{margin:0;font-size:18px;letter-spacing:-.025em;font-weight:700;font-variation-settings:'wdth' 108}
.sheet header .pill{margin-left:auto}
.sheet .body{padding:17px 18px;overflow:auto}
.sheet footer{display:flex;gap:8px;flex-wrap:wrap;margin:0;max-width:none;padding:13px 18px;
  border-top:1px solid var(--line);background:var(--glass);justify-content:flex-start}
.wegzeile{display:flex;align-items:center;gap:9px;flex-wrap:wrap;font-size:15px;margin:0 0 14px}
.wegzeile b{font-weight:700}
.wegzeile i{font-style:normal;color:var(--bus,var(--text-3))}
.kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(148px,1fr));gap:1px;background:var(--line);
  border:1px solid var(--line);border-radius:13px;overflow:hidden;margin:0}
.kv > div{background:var(--glass-2);padding:11px 13px}
.kv dt{font-family:var(--mono);font-size:10px;letter-spacing:.13em;text-transform:uppercase;color:var(--text-3)}
.kv dd{margin:3px 0 0;font-size:15px;letter-spacing:-.01em}
pre.json{margin:14px 0 0;padding:12px 14px;border:1px solid var(--line);border-radius:13px;background:var(--void);
  font-family:var(--mono);font-size:12px;line-height:1.55;color:var(--text-2);max-height:38vh;overflow:auto;white-space:pre}
.hinweis{margin:13px 0 0;font-size:13px;color:var(--text-3);line-height:1.55}
.buslegend{display:flex;flex-wrap:wrap;gap:6px 18px;margin-top:14px;font-family:var(--mono);font-size:11.5px;color:var(--text-3)}
.buslegend span{display:inline-flex;align-items:center;gap:7px}
.buslegend i{width:16px;height:2px;border-radius:2px;background:currentColor;flex:none}
.buslegend .leer{background:none;border-top:2px dotted currentColor;height:0;opacity:.45}
.buslegend .opt{background:none;border-top:2px dotted currentColor;height:0}
.buslegend .name{background:none;border-top:2px dashed currentColor;height:0}
.role{font-family:var(--mono);font-size:10.5px;letter-spacing:.04em;color:var(--text-3);margin:0;
  display:flex;align-items:flex-start;gap:7px;line-height:1.45}
.role::before{content:"";width:6px;height:6px;margin-top:5px;border-radius:2px;background:var(--rc,var(--text-3));flex:none}
.tile{position:relative;z-index:1;border-radius:15px;padding:11px 13px;display:flex;flex-direction:column;gap:0;
  cursor:pointer;opacity:0;animation:fade .7s ease forwards}
.tile-bg{position:absolute;inset:0;border-radius:inherit;border:1px solid var(--line);background:var(--glass);box-shadow:var(--shadow-lg);
  -webkit-backdrop-filter:blur(15px) saturate(1.3);backdrop-filter:blur(15px) saturate(1.3);transition:border-color var(--t-m),box-shadow var(--t-m)}
.tile:hover .tile-bg,.tile:focus-within .tile-bg{border-color:var(--line-hi)}
@keyframes fade{to{opacity:1}}
.t-head{position:relative;display:flex;align-items:center;gap:11px}
.t-nm{min-width:0;flex:1}
.t-idx{display:block;font-family:var(--mono);font-size:10px;letter-spacing:.15em;text-transform:uppercase;color:var(--text-3);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.t-head h2{margin:1px 0 0;font-size:17px;letter-spacing:-.02em;font-weight:700;font-variation-settings:'wdth' 108;line-height:1.2;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tag{font-family:var(--mono);font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--text-3);
  border:1px solid var(--line);border-radius:100px;padding:2px 8px;white-space:nowrap}
.state{position:absolute;top:-4px;right:-4px;pointer-events:none}
.s-txt{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.dot{display:block;width:9px;height:9px;border-radius:50%;background:var(--text-3);
  box-shadow:0 0 0 2px var(--glass-2);animation:pulse 1.4s ease-in-out infinite}
.state[data-s="live"] .dot{background:var(--teal);animation:none;box-shadow:0 0 0 3px color-mix(in srgb,var(--teal) 22%,transparent)}
.state[data-s="slow"] .dot{background:var(--amber);animation:none}
.state[data-s="bereit"] .dot{background:var(--text-3);animation:none;opacity:.7}
@keyframes pulse{50%{opacity:.35}}

/* Die Kachel zeigt kein laufendes Fenster mehr, sondern ihr Zeichen –
   der Datenfluss soll das Bild führen. Das Fenster wächst erst beim
   Antippen aus dem Zeichen heraus. */
.shot{position:relative;width:42px;height:42px;flex:none;border-radius:13px;cursor:pointer;outline:none;
  display:grid;place-items:center;color:var(--sc,var(--text-2));
  border:1px solid color-mix(in srgb,var(--sc,var(--text-3)) 32%,transparent);
  background:color-mix(in srgb,var(--sc,var(--text-3)) 12%,transparent);
  transition:background var(--t-s),border-color var(--t-s),transform var(--t-s)}
.shot svg{width:21px;height:21px}
.tile:hover .shot,.tile:focus-within .shot{transform:translateY(-1px);
  background:color-mix(in srgb,var(--sc,var(--text-3)) 20%,transparent);
  border-color:color-mix(in srgb,var(--sc,var(--text-3)) 58%,transparent)}
.shot:focus-visible{box-shadow:0 0 0 2px var(--amber)}
/* Das Fenster hängt am Seitenkörper, nicht in der Kachel: so kann kein
   Umschlag mit transform, Filter oder :hover seine feste Lage kapern –
   ein Fehler, der sich nur in Safari zeigte. */
.frame{position:fixed;left:0;top:0;width:0;height:0;z-index:60;overflow:hidden;border-radius:14px;
  background:var(--void);border:1px solid transparent;box-shadow:0 40px 120px -20px rgba(0,0,0,.6);
  opacity:0;visibility:hidden;pointer-events:none}
.frame.fixed{opacity:1;visibility:visible}
.vp{position:absolute;left:0;top:0;width:var(--W,1280px);height:var(--H,800px);transform-origin:0 0;pointer-events:none}
.frame.live{pointer-events:auto}
.frame.live .vp{pointer-events:auto}
.vp iframe{display:block;width:100%;height:100%;border:0;background:transparent}
.veil{position:absolute;inset:0;display:grid;place-items:center;gap:10px;align-content:center;text-align:center;padding:16px;
  background:linear-gradient(110deg,transparent 30%,var(--glass) 50%,transparent 70%) var(--void);background-size:250% 100%;
  animation:shimmer 1.6s linear infinite;transition:opacity .4s ease;font-family:var(--mono);font-size:12px;color:var(--text-3)}
.veil.gone{opacity:0;pointer-events:none;animation:none}
@keyframes shimmer{from{background-position:120% 0}to{background-position:-120% 0}}
/* Die Kachel zeigt nur Zeichen, Name und Bestand. Der Text kommt auf
   Wunsch – so bleibt Platz für die Leitungen dazwischen. */
.role,.desc,.meta,.push,.t-more{position:relative}
.more{flex:none;height:25px;padding:0 10px;border-radius:100px;border:1px solid var(--line);background:transparent;
  cursor:pointer;font-family:var(--mono);font-size:10.5px;letter-spacing:.06em;color:var(--text-3);white-space:nowrap;
  transition:border-color var(--t-s),color var(--t-s),background var(--t-s)}
.more:hover{border-color:var(--line-hi);color:var(--text);background:var(--glass)}
.push{display:block;margin-top:8px;font-family:var(--mono);font-size:11px;color:var(--text-3);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.push:empty{display:none}
.t-more{display:grid;grid-template-rows:0fr;transition:grid-template-rows var(--t-m) cubic-bezier(.2,.8,.2,1)}
.tile.offen .t-more{grid-template-rows:1fr}
.t-more > div{overflow:hidden;min-height:0;display:flex;flex-direction:column;gap:8px;padding-top:10px}
.desc{margin:0;color:var(--text-2);font-size:13.5px;line-height:1.5}
.meta{display:flex;justify-content:flex-end;gap:10px;font-family:var(--mono);font-size:11px;color:var(--text-3)}
.meta a{text-decoration:none;border-bottom:1px solid var(--line)}
.meta a:hover{color:var(--text);border-color:var(--amber)}

/* Zoom-Leiste */
.scrim{position:fixed;inset:0;z-index:50;background:color-mix(in srgb,var(--void) 80%,transparent);opacity:0;pointer-events:none;
  transition:opacity var(--t-m) ease;-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
body.zoomed .scrim{opacity:1;pointer-events:auto}
.bar{position:fixed;top:0;left:0;right:0;z-index:70;padding:env(safe-area-inset-top) 10px 0;height:calc(58px + env(safe-area-inset-top));
  display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--glass-edge);background:var(--glass-2);
  -webkit-backdrop-filter:blur(15px) saturate(1.3);backdrop-filter:blur(15px) saturate(1.3);
  transform:translateY(-102%);transition:transform var(--t-m) cubic-bezier(.2,.8,.2,1)}
body.zoomed .bar{transform:none}
.bar-title{display:flex;align-items:baseline;gap:10px;min-width:0;flex:1;justify-content:center}
.bar-title strong{font-size:16px;font-weight:700;letter-spacing:-.01em;font-variation-settings:'wdth' 108;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar-title .t-idx{flex:none}
.bar .grp{display:flex;gap:6px;align-items:center}
.pill.primary{background:var(--amber);color:#12171F;border-color:transparent;font-weight:600}
.pill.primary:hover{background:var(--amber);filter:brightness(1.06)}
.kbd{font-family:var(--mono);font-size:11px;color:var(--text-3);border:1px solid var(--line);border-radius:5px;padding:0 5px;margin-left:2px}

footer{position:relative;max-width:var(--max);margin:0 auto;padding:26px var(--pad) calc(40px + env(safe-area-inset-bottom));
  display:flex;flex-wrap:wrap;gap:10px 22px;justify-content:space-between;border-top:1px solid var(--line);font-family:var(--mono);font-size:12px;color:var(--text-3)}
footer a{text-decoration:none}
footer a:hover{color:var(--text)}

@media (max-width:720px){
  :root{--pad:16px}
  .clock,.hide-sm{display:none!important}
  .nav-in{padding-left:14px}
  .grid{grid-template-columns:1fr;column-gap:14px;row-gap:38px;padding:26px 30px 90px}
  .tile{min-width:0}
  .bar-title{justify-content:flex-start}
  .bar-title .tag{display:none}
}
@media (prefers-reduced-motion:reduce){
  .tile{animation:none;opacity:1}
  .dot,.veil{animation:none}
}

/* Lebendige Kachelzeile: läuft die Uhr, blinkt der Punkt mit. */
.meta .push.run{color:var(--acc,#63D9C4)}
.meta .push.run::before{content:'';display:inline-block;width:7px;height:7px;
  border-radius:99px;background:currentColor;margin-right:6px;vertical-align:1px;
  animation:wbpuls 1.6s ease-in-out infinite}
@keyframes wbpuls{0%,100%{opacity:1}50%{opacity:.25}}

/* ═══════════════════════════════════════════════════════════════
   WERKBANK — kanonischer Token-Satz, Stand 19.09.2026
   Eine Quelle für Auftritt und Werkzeuge. Die Aliase am Ende halten
   die gewachsenen Namen am Leben, bis alles die kanonischen benutzt.
   ═══════════════════════════════════════════════════════════════ */
:root{
  /* Schrift */
  --display:"Archivo","Helvetica Neue",Arial,sans-serif;
  --body:"Archivo","Helvetica Neue",Arial,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
  /* Flächen und Schrift */
  --void:#06090E;
  --text:#EDF0F3; --text-2:#9BA6B2; --text-3:#6B7683;
  --line:rgba(255,255,255,.09); --line-strong:rgba(255,255,255,.17);
  --glass:rgba(16,22,31,.55);          /* Glas mit Blur dahinter */
  --film:rgba(255,255,255,.045);       /* heller Schleier auf Glas */
  --surface:rgba(12,17,24,.86);        /* deckende Fläche: Dialog, Tafel */
  --shadow:0 18px 46px -22px rgba(0,0,0,.75);
  /* Akzente */
  --amber:#F2B33D; --amber-soft:rgba(242,179,61,.14);
  --free:#63D9C4; --free-ink:#63D9C4;
  --over:#EE8E6A; --red-ink:#E8646E;
  --ink:#12171F;                       /* Schrift auf Bernstein */
  --em-1:#F2B33D; --em-2:#F7D68C; --em-3:#63D9C4;
  /* Bewegung */
  --t-s:.25s; --t-m:.45s; --t-lang:.8s;
  --kurve:cubic-bezier(.2,.8,.2,1);      /* die Handschrift des Hauses */
  --t-kurz:var(--t-s); --t-aussehen:.35s;
  /* Aliase auf die gewachsenen Namen */
  --teal:var(--free); --accent:var(--amber); --accent2:var(--free);
  --acc-brand:var(--amber);
  --txt:var(--text); --muted:var(--text-2); --muted-2:var(--text-3);
  --panel:var(--glass); --panel2:var(--film); --glass-2:var(--surface);
  --ok:var(--free-ink); --bad:var(--red-ink); --danger:var(--red-ink);
  --off:var(--text-3); --on-accent:var(--ink);
}
html[data-theme="light"]{
  --void:#EEF1F6;
  --text:#111923; --text-2:#4A5563; --text-3:#7A8493;
  --line:rgba(17,28,44,.10); --line-strong:rgba(17,28,44,.20);
  --glass:rgba(255,255,255,.62);
  --film:rgba(255,255,255,.55);
  --surface:rgba(250,251,253,.92);
  --shadow:0 20px 44px -24px rgba(20,36,60,.38);
  --amber:#E0A21F; --amber-soft:rgba(224,162,31,.16);
  --free:#2FA894; --free-ink:#17806D;
  --over:#D2704A; --red-ink:#C6404E;
  --em-1:#B8791A; --em-2:#8E7A26; --em-3:#14796A;
}

/* ═══════════════════════════════════════════════════════════════
   Wer Bewegung abgestellt hat, bekommt keine. Pauschal statt
   handverlesen: die alten Einzelregeln deckten je ein bis zwei
   Selektoren ab, alles andere lief weiter.
   ═══════════════════════════════════════════════════════════════ */
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{
    animation-duration:.001ms!important;
    animation-iteration-count:1!important;
    transition-duration:.001ms!important;
    scroll-behavior:auto!important}
}

/* Dekoration kostet am Telefon am meisten und bringt dort am wenigsten:
   die driftenden Farbfelder stehen still, der Weichzeichner wird kleiner. */
@media (max-width:820px),(pointer:coarse){
  .blob,.bg i{animation:none!important}
  .blob{filter:blur(48px)}
  .bg i{filter:blur(38px)}
}

/* Im Bündel liegen die Adern dicht – die Höfe würden sich sonst zu einem
   Schleier stapeln. Eine Ader für sich behält ihren vollen Hof. */
.bus g.gebuendelt .halo{opacity:.028}

/* Eine Leitung, auf der nichts liegt, bewegt sich auch nicht. Sie bleibt
   sichtbar – der Weg ist da, er ist nur noch nicht benutzt. */
.bus g.leer .trace{opacity:.2;stroke-dasharray:2 7}
.bus g.leer .halo{display:none}
.bus g.leer .pad{opacity:.35}
.bus g.leer:hover .trace{opacity:.5;stroke-dasharray:2 7}

/* Die Zeile meldet sich nur, wenn etwas offen ist. Ist nichts offen,
   steht hier nichts – kein „alles in Ordnung", das man nach zwei Wochen
   ohnehin überliest. */
.offen{grid-column:1/-1;position:relative;z-index:2;display:flex;flex-wrap:wrap;gap:8px;
  margin:0 0 6px;font-family:var(--mono);font-size:12px}
.offen:empty{display:none}
.offen button{display:inline-flex;align-items:center;gap:8px;height:30px;padding:0 12px;
  border-radius:100px;border:1px solid var(--line);background:var(--glass);color:var(--text-2);
  font:inherit;cursor:pointer;transition:border-color var(--t-s,.25s) var(--kurve,ease),
  color var(--t-s,.25s) var(--kurve,ease)}
.offen button:hover{border-color:var(--amber);color:var(--text)}
.offen button::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--amber);flex:none}
.offen button.spaet::before{background:var(--em-2,#E2725B)}
.offen b{font-weight:700;font-variation-settings:'wdth' 110}
</style>

<script>
(() => {
'use strict';

/* ───────── Konfiguration: hier neue Werkzeuge eintragen ───────── */

/* ════════════════════════════════════════════════════════════════
   WERKBANK-BUS  ·  gleichlautend in jedem Werkzeug
   ----------------------------------------------------------------
   Alle Werkzeuge liegen unter derselben Herkunft
   (maikunverricht.github.io). Damit teilen sie sich Speicher und
   IndexedDB — der Pfad spielt dafür keine Rolle. Dieser Block macht
   aus dem gemeinsamen Speicher eine Verbindung: wer etwas ändert,
   sagt Bescheid; die anderen ziehen nach, ohne dass jemand neu
   laden muss. Im selben Fenster, im zweiten Tab und in den Kacheln
   des Cockpits.

   Kein Server, keine gemeinsame Datei: der Block steht in jeder
   Einzeldatei wortgleich. Ändert er sich, ändert er sich überall.

   Gespiegelte Bestände (Lesekopien, geschrieben nur vom Eigentümer):
     wb-auftragsbuch-data    Auftraggeber und Aufträge   (Auftragsbuch)
     wb-stempeluhr-summe     Stunden je Auftrag          (Stempeluhr)
     wb-auftragsstatus-data  Prozessschritt und To-dos   (Auftragsstatus)
     wb-terminbuch-data      Termine und Wiedervorlagen  (Terminbuch)
     wb-rechnungsbuch-data   Rechnungen und Zahlungen    (Rechnungsbuch)
   ════════════════════════════════════════════════════════════════ */
const WB = (function(){
  const KANAL = 'werkbank', WECK = 'wb-signal';
  const eigen = Math.random().toString(36).slice(2) + Date.now().toString(36);
  const hoerer = [];
  let bc = null;
  try { bc = new BroadcastChannel(KANAL); } catch (e) { /* ältere Browser */ }

  function zustellen(n){
    if (!n || typeof n !== 'object' || n.von === eigen) return;
    for (let i = 0; i < hoerer.length; i++) {
      const h = hoerer[i];
      if (h.thema && h.thema !== n.thema) continue;
      try { h.fn(n); } catch (e) {}
    }
  }
  if (bc) bc.onmessage = function(e){ zustellen(e.data); };
  /* Rückfall für Fenster ohne BroadcastChannel und für Tabs, die den
     Kanal verpasst haben: das storage-Ereignis feuert in allen
     übrigen Tabs derselben Herkunft. */
  addEventListener('storage', function(e){
    if (e.key !== WECK || !e.newValue) return;
    try { zustellen(JSON.parse(e.newValue)); } catch (err) {}
  });

  return {
    id: eigen,
    /* Melden, dass sich etwas geändert hat. */
    melden: function(thema, zusatz){
      const n = Object.assign({ thema: thema, von: eigen, zeit: Date.now() }, zusatz || {});
      if (bc) { try { bc.postMessage(n); } catch (e) {} }
      try { localStorage.setItem(WECK, JSON.stringify(n)); } catch (e) {}
    },
    /* Auf ein Thema horchen — oder mit null auf alle. */
    horchen: function(thema, fn){ hoerer.push({ thema: thema, fn: fn }); },
    /* Einen gespiegelten Bestand lesen bzw. schreiben. */
    lesen: function(schluessel){
      try { const r = localStorage.getItem(schluessel); return r ? JSON.parse(r) : null; }
      catch (e) { return null; }
    },
    schreiben: function(schluessel, wert){
      try { localStorage.setItem(schluessel, JSON.stringify(wert)); return true; }
      catch (e) { return false; }
    }
  };
})();
const WB_AB_LS = 'wb-auftragsbuch-data';
const WB_ZEIT_LS = 'wb-stempeluhr-summe';
const WB_NOTES_LS = 'wb-noteos-stand';
const WB_STATUS_LS = 'wb-auftragsstatus-data';
const WB_TERMIN_LS = 'wb-terminbuch-data';
const WB_RECH_LS = 'wb-rechnungsbuch-data';

/* Aussehen gilt für die ganze Werkbank. Geschrieben werden beide
   Schlüssel — jedes Werkzeug liest beim Start seinen eigenen, und so
   finden alle denselben Stand vor. Gemeldet wird zusätzlich über den
   Bus, damit offene Fenster sofort mitziehen. */
const WB_THEME_KEYS = ['wb-theme', 'wb-cockpit-theme'];
function wbThemeSichern(t){
  WB_THEME_KEYS.forEach(k => { try { localStorage.setItem(k, t); } catch (e) {} });
}

const USER = 'maikunverricht';

/* Die Bänder folgen dem Arbeitsprozess. Wer ein Werkzeug ergänzt, trägt es
   unten in APPS ein und setzt gruppe auf eine dieser Kennungen. */
const GRUPPEN = [
  { id:'prozess',   titel:'Der Arbeitsprozess',
    unter:'Von der Anfrage bis zum Geldeingang. Jedes Werkzeug läuft allein – zusammen wissen sie mehr voneinander.' },
  { id:'werkstatt', titel:'Werkstatt',
    unter:'Was neben dem Prozess liegt: Quellcode und alles, was noch dazukommt.' }
];

const APPS = [
  { id:'auftragsbuch',   name:'Auftragsbuch',   tag:'Auftraggeber',   gruppe:'prozess', schritt:1,
    url:'https://maikunverricht.github.io/Auftragsbuch/',   repo:'Auftragsbuch',
    fluss:'führt Stammdaten · zeigt Zeit und Notizen dazu', rc:'var(--amber)',
    desc:'Auftraggeber, Aufträge und Konditionen an einem Ort – alle anderen bedienen sich hier.' },
  { id:'stempeluhr',     name:'Stempeluhr',     tag:'Zeiterfassung',  gruppe:'prozess', schritt:2,
    url:'https://maikunverricht.github.io/StopUhr/',        repo:'StopUhr',
    fluss:'führt Zeitbuchungen · liest Stammdaten', rc:'var(--teal)',
    desc:'Arbeitszeiten stempeln, Kunden und Projekten zuordnen, Auswertungen erzeugen.' },
  { id:'auftragsstatus', name:'Auftragsstatus', tag:'Fortschritt',    gruppe:'prozess', schritt:3,
    url:'https://maikunverricht.github.io/Auftragsstatus/', repo:'Auftragsstatus',
    fluss:'führt Prozessschritt, To-dos und Meilensteine · liest Stammdaten und Zeit', rc:'var(--em-2)',
    desc:'Prozessschritt, verbrauchte Zeit und Budget je Auftrag – mit To-dos, Meilensteinen und Zeitstrahl.' },
  { id:'terminbuch',     name:'Terminbuch',     tag:'Termine',        gruppe:'prozess', schritt:4,
    url:'https://maikunverricht.github.io/Terminbuch/',     repo:'Terminbuch',
    fluss:'führt Termine und Wiedervorlagen · liest Stammdaten und Fristen', rc:'var(--info)',
    desc:'Zeitstrahl je Auftrag: eigene Termine, Fristen und Meilensteine aus dem Auftragsstatus – mit ICS-Export.' },
  { id:'rechnungsbuch',  name:'Rechnungsbuch',  tag:'Abrechnung',     gruppe:'prozess', schritt:5,
    url:'https://maikunverricht.github.io/Rechnungsbuch/',  repo:'Rechnungsbuch',
    fluss:'führt Rechnungen und Zahlungen · liest Stammdaten und Zeit', rc:'var(--geld)',
    desc:'Rechnung aus gebuchter Zeit: Entwurf, Festschreibung, offene Posten – Druck und Factur-X.' },
  { id:'noteos',         name:'NoteOS',         tag:'Wissen',         gruppe:'prozess', schritt:6,
    url:'https://maikunverricht.github.io/NoteOS/',         repo:'NoteOS',
    fluss:'liest Auftraggeber · meldet Notizen je Auftraggeber', rc:'var(--amber)',
    desc:'Notizen als Bibliothek: Regale, Bücher und Kategorien statt Ordnerlisten.' }
];

/* ───────── Hilfen ───────── */
const $ = (s, r=document) => r.querySelector(s);
const root = document.documentElement;
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
const DUR = reduce ? 0 : 560;
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad2 = n => String(n).padStart(2,'0');
const rtf = new Intl.RelativeTimeFormat('de', { numeric:'auto' });
function rel(iso){
  const d = (new Date(iso) - Date.now())/1000, a = Math.abs(d);
  const u = [['year',31536e3],['month',2592e3],['week',604800],['day',86400],['hour',3600],['minute',60]];
  for (const [k,s] of u) if (a >= s) return rtf.format(Math.round(d/s), k);
  return 'gerade eben';
}
const store = {
  get(k){ try { return localStorage.getItem(k); } catch(e){ return null; } },
  set(k,v){ try { localStorage.setItem(k,v); } catch(e){} }
};

/* ───────── Theme & Uhr ───────── */
function themeSetzen(t, melden){
  root.setAttribute('data-theme', t);
  $('meta[name="theme-color"]').content = t === 'light' ? '#EEF1F6' : '#06090E';
  if (melden) { wbThemeSichern(t); WB.melden('theme', { theme:t }); }
}
$('#themeBtn').addEventListener('click', () => {
  themeSetzen(root.getAttribute('data-theme') === 'light' ? 'dark' : 'light', true);
});
WB.horchen('theme', n => { if (n.theme === 'light' || n.theme === 'dark') themeSetzen(n.theme, false); });
$('meta[name="theme-color"]').content = root.getAttribute('data-theme') === 'light' ? '#EEF1F6' : '#06090E';
$('#yr').textContent = new Date().getFullYear();
const clock = $('#clock');
const tick = () => { const d = new Date(); clock.textContent = pad2(d.getHours())+':'+pad2(d.getMinutes()); };
tick(); setInterval(tick, 15000);

/* ───────── Was steht gerade in den Werkzeugen? ─────────
   Die Kacheln zeigen nicht nur ein Bild, sondern den Bestand: das
   Cockpit liest die Lesekopien mit, die Auftragsbuch und Stempeluhr
   unter derselben Herkunft ablegen. Kein Netzaufruf, keine
   Abhängigkeit — fehlt eine Kopie, bleibt die Zeile leer. */
const nf1 = new Intl.NumberFormat('de-DE', { maximumFractionDigits:1 });
const nfE = new Intl.NumberFormat('de-DE', { style:'currency', currency:'EUR', maximumFractionDigits:0 });
const nfT = new Intl.DateTimeFormat('de-DE', { day:'2-digit', month:'2-digit' });
const isoTag = d => { const x = new Date(d); return new Date(x.getTime() - x.getTimezoneOffset()*60000).toISOString().slice(0,10); };
const cent = v => Math.round((Number(v) || 0) * 100) / 100;
/* Brutto und Rest einer Rechnung – dieselbe Rundung wie im Rechnungsbuch:
   erst je Position auf Cent, dann die Steuer je Satzgruppe. */
function rechSumme(r){
  const pos = Array.isArray(r.positionen) ? r.positionen : [];
  let netto = 0; const grp = {};
  pos.forEach(p => {
    const zeile = cent((+p.menge || 0) * (+p.preis || 0));
    netto = cent(netto + zeile);
    const s = r.steuerfall === 'regel' ? (+p.satz || 0) : 0;
    grp[s] = cent((grp[s] || 0) + zeile);
  });
  let steuer = 0;
  Object.keys(grp).forEach(s => { steuer = cent(steuer + cent(grp[s] * parseFloat(s) / 100)); });
  const brutto = cent(netto + steuer);
  const bezahlt = (Array.isArray(r.zahlungen) ? r.zahlungen : []).reduce((s, z) => cent(s + (+z.betrag || 0)), 0);
  return { netto, brutto, rest:cent(brutto - bezahlt) };
}
function standVon(id){
  if (id === 'auftragsbuch') {
    const d = WB.lesen(WB_AB_LS);
    if (!d || !Array.isArray(d.auftraggeber)) return null;
    const offen = new Set(['geplant','aktiv','pausiert']);
    const n = d.auftraggeber.filter(x => x && x.aktiv !== false).length;
    const o = (d.auftraege || []).filter(x => x && offen.has(x.status)).length;
    if (!n && !o) return null;
    return n + ' Auftraggeber · ' + o + (o === 1 ? ' offener Auftrag' : ' offene Aufträge');
  }
  if (id === 'noteos') {
    const n = WB.lesen(WB_NOTES_LS);
    if (!n || !n.anzahl) return null;
    return n.anzahl + (n.anzahl === 1 ? ' Notiz' : ' Notizen')
         + (n.kategorien ? ' · ' + n.kategorien + ' Kategorien' : '');
  }
  if (id === 'auftragsstatus') {
    const d = WB.lesen(WB_STATUS_LS);
    if (!d) return null;
    const offen = new Set(['geplant','aktiv','pausiert']);
    const eigene = Array.isArray(d.auftraege) ? d.auftraege : [];
    const schritte = d.status && typeof d.status === 'object' ? d.status : {};
    const ids = new Set(eigene.map(x => x && x.id).filter(Boolean).concat(Object.keys(schritte)));
    let o = 0;
    ids.forEach(k => {
      const e = eigene.find(x => x && x.id === k);
      if (offen.has(schritte[k] || (e && e.status))) o++;
    });
    let t = 0;
    const inh = d.inhalte && typeof d.inhalte === 'object' ? d.inhalte : {};
    Object.keys(inh).forEach(k => {
      const l = inh[k] && Array.isArray(inh[k].todos) ? inh[k].todos : [];
      t += l.filter(x => x && !x.erledigt).length;
    });
    if (!ids.size && !t) return null;
    return o + (o === 1 ? ' offener Auftrag' : ' offene Aufträge')
         + (t ? ' · ' + t + ' offene To-dos' : '');
  }
  if (id === 'terminbuch') {
    const d = WB.lesen(WB_TERMIN_LS);
    if (!d || !Array.isArray(d.termine) || !d.termine.length) return null;
    const heute = isoTag(Date.now());
    const offen = d.termine.filter(t => t && t.datum && !t.erledigt);
    const kommend = offen.filter(t => t.datum >= heute).sort((a,b) => a.datum.localeCompare(b.datum));
    const faellig = offen.filter(t => t.art === 'erinnerung' && t.datum < heute).length;
    if (!kommend.length && !faellig) return d.termine.length + ' Einträge · nichts offen';
    return (kommend.length ? kommend.length + (kommend.length === 1 ? ' Termin' : ' Termine')
              + ' · nächster ' + nfT.format(new Date(kommend[0].datum + 'T12:00:00')) : 'keine Termine')
         + (faellig ? ' · ' + faellig + ' Wiedervorlage' + (faellig === 1 ? '' : 'n') : '');
  }
  if (id === 'rechnungsbuch') {
    const d = WB.lesen(WB_RECH_LS);
    if (!d || !Array.isArray(d.rechnungen) || !d.rechnungen.length) return null;
    const heute = isoTag(Date.now());
    let offen = 0, spaet = 0, entw = 0;
    d.rechnungen.forEach(r => {
      if (!r) return;
      if (!r.festgeschrieben) { entw++; return; }
      if (r.storniert || r.stornoVon) return;
      const s = rechSumme(r);
      if (s.rest <= 0.005) return;
      offen = cent(offen + s.rest);
      const ziel = new Date((r.datum || heute) + 'T12:00:00');
      ziel.setDate(ziel.getDate() + (parseInt(r.ziel, 10) || 0));
      if (isoTag(ziel) < heute) spaet++;
    });
    if (!offen && !entw) return d.rechnungen.length + ' Rechnungen · alles bezahlt';
    return (offen ? nfE.format(offen) + ' offen' : 'nichts offen')
         + (spaet ? ' · ' + spaet + '× überfällig' : '')
         + (entw ? ' · ' + entw + (entw === 1 ? ' Entwurf' : ' Entwürfe') : '');
  }
  if (id === 'stempeluhr') {
    const z = WB.lesen(WB_ZEIT_LS);
    if (!z || !z.gesamt) return null;
    const h = nf1.format((z.gesamt.sec || 0)/3600) + ' h';
    if (z.laufend && z.laufend.aktiv) return (z.laufend.pausiert ? 'pausiert' : 'Uhr läuft') + ' · ' + h;
    return h + ' gebucht · ' + (z.gesamt.buchungen || 0) + ' Buchungen';
  }
  return null;
}
/* ───────── Was offen ist ─────────
   Drei Fragen, die kein einzelnes Werkzeug beantworten kann, weil sie
   über zwei Bestände gehen. Gelesen werden dieselben Lesekopien wie
   überall; fehlt eine, fällt ihr Posten weg. Ist nichts offen, bleibt
   die Zeile leer und blendet sich per CSS aus. */
function offeneWelt(){
  const p = [];

  const z = WB.lesen(WB_ZEIT_LS);
  if (z && z.offen && z.offen.buchungen) {
    p.push({ zu:'stempeluhr', spaet:false,
             text:'<b>' + nf1.format(z.offen.sec/3600) + ' h</b> nicht abgerechnet' });
  }

  const r = WB.lesen(WB_RECH_LS);
  if (r && Array.isArray(r.rechnungen)) {
    const heute = isoTag(Date.now());
    let spaet = 0, summe = 0;
    r.rechnungen.forEach(x => {
      if (!x || !x.festgeschrieben || x.storniert || x.stornoVon) return;
      const s = rechSumme(x);
      if (s.rest <= 0.005) return;
      const ziel = new Date((x.datum || heute) + 'T12:00:00');
      ziel.setDate(ziel.getDate() + (parseInt(x.ziel, 10) || 0));
      if (isoTag(ziel) < heute) { spaet++; summe = cent(summe + s.rest); }
    });
    if (spaet) p.push({ zu:'rechnungsbuch', spaet:true,
      text:'<b>' + spaet + '</b> ' + (spaet === 1 ? 'Rechnung' : 'Rechnungen')
         + ' überfällig · ' + nfE.format(summe) });
  }

  const t = WB.lesen(WB_TERMIN_LS);
  if (t && Array.isArray(t.termine)) {
    const heute = isoTag(Date.now());
    const grenze = new Date(); grenze.setDate(grenze.getDate() + 7);
    const bis = isoTag(grenze);
    let woche = 0, ueber = 0;
    t.termine.forEach(x => {
      if (!x || !x.datum || x.erledigt) return;
      if (x.datum < heute) ueber++;
      else if (x.datum <= bis) woche++;
    });
    if (ueber) p.push({ zu:'terminbuch', spaet:true,
      text:'<b>' + ueber + '</b> ' + (ueber === 1 ? 'Frist' : 'Fristen') + ' überschritten' });
    if (woche) p.push({ zu:'terminbuch', spaet:false,
      text:'<b>' + woche + '</b> ' + (woche === 1 ? 'Frist' : 'Fristen') + ' in sieben Tagen' });
  }

  const el = document.getElementById('offen');
  if (!el) return;
  el.innerHTML = p.map(x =>
    '<button type="button" class="' + (x.spaet ? 'spaet' : '') + '" data-zu="' + x.zu + '">'
    + x.text + '</button>').join('');
  el.querySelectorAll('[data-zu]').forEach(b =>
    b.addEventListener('click', () => open(b.dataset.zu)));
}

    setTimeout(() => {

/* ───────── Liegt auf dieser Leitung überhaupt etwas? ─────────
   Was nicht da ist, kann nicht fließen. Die Leitung wird trotzdem
   gezeichnet – der Weg besteht, er ist nur noch unbenutzt. Gelesen wird
   dieselbe Lesekopie, die auch der Inspektor öffnet. */
function hatInhalt(art){
  const q = QUELLE[art];
  if (!q) return true;
  const d = WB.lesen(q.ls);
  if (!d) return false;
  const w = q.feld ? d[q.feld] : d;
  if (!w) return false;
  if (Array.isArray(w)) return w.length > 0;
  if (typeof w === 'object') return Object.keys(w).length > 0;
  return !!w;
}

function kennzahlen(art, d){
  const z = [];
  if (!d || typeof d !== 'object') return z;
  if (art === 'stamm' || art === 'kat') {
    z.push(['Auftraggeber', (d.auftraggeber || []).length]);
    if (art === 'stamm') z.push(['Aufträge', (d.auftraege || []).length]);
  } else if (art === 'notiz') {
    z.push(['Notizen', d.anzahl || 0]);
    z.push(['Kategorien', d.kategorien || 0]);
    if (d.jeAuftraggeber) {
      const ids = Object.keys(d.jeAuftraggeber);
      z.push(['verknüpfte Auftraggeber', ids.length]);
      z.push(['Notizen daran', ids.reduce((s,k) => s + (d.jeAuftraggeber[k] || 0), 0)]);
    } else if (d.jeKategorie) {
      z.push(['gezählte Kategorien', Object.keys(d.jeKategorie).length]);
    }
    if (d.zuletzt) z.push(['zuletzt', String(d.zuletzt)]);
  } else if (art === 'frist') {
    const inh = d.inhalte && typeof d.inhalte === 'object' ? d.inhalte : {};
    const heute = isoTag(Date.now());
    let fr = 0, spaet = 0, ms = 0;
    Object.keys(inh).forEach(k => {
      (Array.isArray(inh[k].todos) ? inh[k].todos : []).forEach(t => {
        if (!t || !t.faellig) return;
        fr++;
        if (!t.erledigt && String(t.faellig).slice(0,10) < heute) spaet++;
      });
      ms += (Array.isArray(inh[k].meilensteine) ? inh[k].meilensteine : []).length;
    });
    z.push(['Aufträge mit Inhalt', Object.keys(inh).length]);
    z.push(['Fristen', fr]);
    z.push(['davon überfällig', spaet]);
    z.push(['Meilensteine', ms]);
  } else if (art === 'zeit' || art === 'summe') {
    if (d.gesamt) {
      z.push(['Stunden', nf1.format((d.gesamt.sec || 0)/3600)]);
      z.push(['Buchungen', d.gesamt.buchungen || 0]);
    }
    if (art === 'summe' && d.jeAuftrag) z.push(['Aufträge mit Zeit', Object.keys(d.jeAuftrag).length]);
    if (d.laufend && d.laufend.aktiv) z.push(['Uhr', d.laufend.pausiert ? 'pausiert' : 'läuft']);
  } else {
    z.push(['Prozessschritte', Object.keys(d.status || {}).length]);
    z.push(['Aufträge mit Inhalt', Object.keys(d.inhalte || {}).length]);
    z.push(['eigene Aufträge', (d.auftraege || []).length]);
  }
  if (d.updated) z.push(['Stand', rel(d.updated)]);
  return z;
}

/* Rechtwinkliger Weg mit gerundeten Ecken. */
function orth(pts, rad){
  const f = n => Math.round(n*10)/10;
  let d = 'M' + f(pts[0][0]) + ' ' + f(pts[0][1]);
  for (let i = 1; i < pts.length - 1; i++){
    const a = pts[i-1], p = pts[i], b = pts[i+1];
    const l1 = Math.hypot(p[0]-a[0], p[1]-a[1]), l2 = Math.hypot(b[0]-p[0], b[1]-p[1]);
    if (!l1 || !l2) continue;
    const r = Math.min(rad, l1/2, l2/2);
    const u1 = [(p[0]-a[0])/l1, (p[1]-a[1])/l1], u2 = [(b[0]-p[0])/l2, (b[1]-p[1])/l2];
    d += ' L' + f(p[0]-u1[0]*r) + ' ' + f(p[1]-u1[1]*r)
       + ' Q' + f(p[0]) + ' ' + f(p[1]) + ' ' + f(p[0]+u2[0]*r) + ' ' + f(p[1]+u2[1]*r);
  }
  const e = pts[pts.length-1];
  return d + ' L' + f(e[0]) + ' ' + f(e[1]);
}

function busZeichnen(){
  const gb = grid.getBoundingClientRect();
  if (!gb.width || !tiles.length) return;
  const R = {};
  let maxR = 0, minL = Infinity;
  tiles.forEach(t => {
    const b = t.el.getBoundingClientRect();
    const r = { l:b.left-gb.left, t:b.top-gb.top, r:b.right-gb.left, b:b.bottom-gb.top };
    r.cx = (r.l+r.r)/2; r.cy = (r.t+r.b)/2;
    R[t.app.id] = r;
    maxR = Math.max(maxR, r.r); minL = Math.min(minL, r.l);
  });
  busEl.setAttribute('viewBox', '0 0 ' + Math.round(gb.width) + ' ' + Math.round(gb.height));
  busEl.setAttribute('width', Math.round(gb.width));
  busEl.setAttribute('height', Math.round(gb.height));

  /* ═══ Erst die Bahn bestimmen, dann zeichnen ═══
     Wer denselben Weg nimmt, fährt auf derselben Bahn. Die Adern liegen
     mittig um sie herum, damit das Bündel dort bleibt, wo eine einzelne
     Leitung auch verlaufen wäre. */
  const ADER = 3;        /* Abstand der Adern im Bündel */
  const ABSTAND = 26;    /* Abstand der Bahn von der Kachelkante */

  const plan = [];
  FLUSS.forEach((f, i) => {
    const a = R[f.von], b = R[f.nach];
    if (!a || !b) return;
    const reihe = Math.abs(a.t - b.t) < 8;
    const runter = b.t - a.b, hoch = a.t - b.b;
    const gleicheSpalte = Math.abs(a.cx - b.cx) < 8;
    let art, grund;
    if (reihe) {
      art = f.seite > 0 ? 'unten' : 'oben';
      grund = f.seite > 0 ? Math.max(a.b, b.b) + ABSTAND : Math.min(a.t, b.t) - ABSTAND;
    } else if (runter > 0 && runter < 90) {
      art = 'luecke'; grund = a.b + runter / 2;
    } else if (hoch > 0 && hoch < 90) {
      art = 'luecke'; grund = b.b + hoch / 2;
    } else {
      art = f.seite > 0 ? 'rechts' : 'links';
      grund = f.seite > 0 ? maxR + ABSTAND : minL - ABSTAND;
    }
    plan.push({ f:f, i:i, a:a, b:b, art:art, grund:grund, reihe:reihe,
                gleicheSpalte:gleicheSpalte, runter:runter, hoch:hoch,
                schluessel: art + '|' + Math.round(grund / 12) });
  });
  const gruppen = {};
  plan.forEach(p => { (gruppen[p.schluessel] = gruppen[p.schluessel] || []).push(p); });
  Object.keys(gruppen).forEach(k => {
    const g = gruppen[k];
    g.forEach((p, n) => { p.ader = (n - (g.length - 1) / 2) * ADER; });
  });

  let out = '';
  plan.forEach(p => {
    const f = p.f, a = p.a, b = p.b, i = p.i;
    const farbe = BUSFARBE[f.art];
    let pts;
    if (p.art === 'unten' || p.art === 'oben') {
      const unten = p.art === 'unten', y = p.grund + p.ader;
      pts = [[a.cx, unten ? a.b : a.t], [a.cx, y], [b.cx, y], [b.cx, unten ? b.b : b.t]];
    } else if (p.art === 'luecke') {
      const abwaerts = p.runter > 0 && p.runter < 90;
      const vonY = abwaerts ? a.b : a.t, nachY = abwaerts ? b.t : b.b;
      if (p.gleicheSpalte) { const x = a.cx + p.ader; pts = [[x, vonY], [x, nachY]]; }
      else { const y = p.grund + p.ader;
             pts = [[a.cx, vonY], [a.cx, y], [b.cx, y], [b.cx, nachY]]; }
    } else {
      const rechts = p.art === 'rechts';
      const x = p.grund + (rechts ? p.ader : -p.ader);
      pts = [[rechts ? a.r : a.l, a.cy], [x, a.cy], [x, b.cy], [rechts ? b.r : b.l, b.cy]];
    }
    const d = orth(pts, 13), id = 'busweg' + i;
    const p0 = pts[0], pE = pts[pts.length-1];
    /* Im Bündel würden sich die Höfe zu einem Schleier stapeln. */
    const buendel = gruppen[p.schluessel].length > 1 ? ' gebuendelt' : '';
    const leer = !hatInhalt(f.art);
    out += '<g class="leitung' + buendel + (leer ? ' leer' : '') + '" style="--bus:' + farbe + '">'
        +  '<path class="halo" d="' + d + '"/>'
        +  '<path class="trace' + (BUSSTRICH[f.art] ? ' ' + BUSSTRICH[f.art] : '') + '" id="' + id + '" d="' + d + '"></path>'
        +  '<circle class="pad" cx="' + p0[0].toFixed(1) + '" cy="' + p0[1].toFixed(1) + '" r="3"/>'
        +  '<circle class="pad" cx="' + pE[0].toFixed(1) + '" cy="' + pE[1].toFixed(1) + '" r="3"/>';
    if (!reduce && !leer) {
      const laenge = pts.reduce((sum, q, k) => k ? sum + Math.hypot(q[0]-pts[k-1][0], q[1]-pts[k-1][1]) : 0, 0);
      const dauer = Math.max(4.5, laenge / 42);
      const takte = 1;
      for (let k = 0; k < takte; k++) {
        const start = (-dauer * k / takte).toFixed(2) + 's';
        const mp = '<mpath href="#' + id + '" xlink:href="#' + id + '"/>';
        out += '<circle class="aura" r="' + (BUSSTRICH[f.art] ? 4 : 5.5) + '">'
            +  '<animateMotion dur="' + dauer.toFixed(2) + 's" begin="' + start + '" repeatCount="indefinite" rotate="auto">' + mp + '</animateMotion></circle>'
            +  '<circle class="pkt" r="' + (BUSSTRICH[f.art] ? 1.9 : 2.6) + '">'
            +  '<animateMotion dur="' + dauer.toFixed(2) + 's" begin="' + start + '" repeatCount="indefinite" rotate="auto">' + mp + '</animateMotion></circle>';
      }
    }
    out += '<path class="hit" d="' + d + '" data-f="' + i + '"><title>'
        +  esc(f.was) + ': ' + esc(byId[f.von].app.name) + ' → ' + esc(byId[f.nach].app.name)
        +  (leer ? ' · noch keine Daten' : '') + ' · klicken zum Hineinsehen</title></path></g>';
  });
  busEl.innerHTML = out;
  busEl.classList.add('on');
  busEl.querySelectorAll('[data-f]').forEach(h =>
    h.addEventListener('click', () => busInspektor(+h.dataset.f)));
}

/* ───────── Inspektor: was liegt auf dieser Leitung? ─────────
   Gelesen wird die Lesekopie unter derselben Herkunft – auf Wunsch die
   verknüpfte Datei über den Handle des führenden Werkzeugs. Das Cockpit
   schreibt nichts: geführt wird jeder Bestand nur an seiner Stelle. */
let busIdx = -1, busInhalt = null;

async function idbHandle(name){
  if (!name || !('indexedDB' in window)) return null;
  try {
    if (indexedDB.databases) {
      const liste = await indexedDB.databases();
      if (liste && liste.length && !liste.some(x => x.name === name)) return null;
    }
    const db = await new Promise((res, rej) => {
      const r = indexedDB.open(name);
      r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error);
    });
    if (!db.objectStoreNames.contains('kv')) { db.close(); return null; }
    const h = await new Promise(res => {
      const t = db.transaction('kv', 'readonly').objectStore('kv').get('handle');
      t.onsuccess = () => res(t.result); t.onerror = () => res(null);
    });
    db.close();
    return h || null;
  } catch(e){ return null; }
}
const meldung = txt => { const el = $('#busMeld'); if (el) el.textContent = txt; };

function zeigeBus(f, q, d, herkunft){
  const nutz = d && q.feld ? d[q.feld] : d;
  const text = (nutz == null) ? '' : JSON.stringify(nutz, null, 2);
  busInhalt = { text, name:q.datei };
  const ab = byId[f.von], zu = byId[f.nach];
  const kz = kennzahlen(f.art, d);
  $('#busBody').innerHTML =
      '<p class="wegzeile" style="--bus:' + BUSFARBE[f.art] + '"><b>' + esc(ab.app.name) + '</b>'
    + '<i>──▸</i><b>' + esc(zu.app.name) + '</b><span class="tag">' + esc(f.was) + '</span></p>'
    + '<dl class="kv"><div><dt>Herkunft</dt><dd>' + esc(herkunft) + '</dd></div>'
    + kz.map(([k, v]) => '<div><dt>' + esc(k) + '</dt><dd>' + esc(String(v)) + '</dd></div>').join('')
    + '</dl>'
    + (text ? '<pre class="json"></pre>'
            : '<p class="hinweis">Hier liegt auf diesem Gerät noch nichts. Öffne ' + esc(ab.app.name)
              + ' einmal – oder lies die Datei ein.</p>')
    + '<p class="hinweis">' + (q.feld ? 'Gezeigt wird der Abschnitt <span class="mono">' + esc(q.feld) + '</span>. ' : '')
    + 'Das Cockpit liest nur mit – geführt wird dieser Bestand allein in ' + esc(ab.app.name) + '.</p>'
    + '<p class="hinweis" id="busMeld"></p>';
  if (text) $('#busBody .json').textContent = text.length > 40000 ? text.slice(0, 40000) + '\n… gekürzt' : text;
  $('#busSichern').disabled = !text;
  $('#busWerkzeug').textContent = ab.app.name + ' öffnen';
}

function busInspektor(i){
  const f = FLUSS[i]; if (!f) return;
  const q = QUELLE[f.art];
  busIdx = i;
  $('#busTitel').textContent = f.was;
  let d = null, herkunft = 'nichts gefunden';
  const roh = WB.lesen(q.ls);
  if (roh) { d = roh; herkunft = 'Lesekopie · ' + q.ls; }
  zeigeBus(f, q, d, herkunft);
  $('#busDatei').hidden = !('showOpenFilePicker' in window) && !q.idb;
  $('#dlgBus').showModal();
}

$('#busZu').addEventListener('click', () => $('#dlgBus').close());
$('#busWerkzeug').addEventListener('click', () => {
  const f = FLUSS[busIdx]; if (!f) return;
  $('#dlgBus').close(); open(f.von);
});
$('#busSichern').addEventListener('click', () => {
  if (!busInhalt || !busInhalt.text) return;
  try {
    const url = URL.createObjectURL(new Blob([busInhalt.text], { type:'application/json' }));
    const a = document.createElement('a');
    a.href = url; a.download = busInhalt.name; a.rel = 'noopener'; a.style.display = 'none';
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 8000);
    meldung('Gesichert als ' + busInhalt.name);
  } catch(e){ meldung('Sichern nicht möglich.'); }
});
$('#busDatei').addEventListener('click', async () => {
  const f = FLUSS[busIdx]; if (!f) return;
  const q = QUELLE[f.art];
  try {
    let h = await idbHandle(q.idb);
    if (h) {
      let p = await h.queryPermission({ mode:'read' });
      if (p !== 'granted') p = await h.requestPermission({ mode:'read' });
      if (p !== 'granted') h = null;
    }
    if (!h) {
      if (!('showOpenFilePicker' in window)) {
        meldung('Dieser Browser kann keine Datei lesen – nur Chrome und Edge am Rechner. Die Lesekopie steht oben.');
        return;
      }
      [h] = await showOpenFilePicker({ multiple:false,
        types:[{ description:'JSON', accept:{ 'application/json':['.json'] } }] });
    }
    const d = JSON.parse(await (await h.getFile()).text());
    zeigeBus(f, QUELLE[f.art], d, 'Datei · ' + h.name);
  } catch(e){
    if (e && e.name !== 'AbortError') meldung('Datei konnte nicht gelesen werden.');
  }
});

let busT;
const busNeu = () => { clearTimeout(busT); busT = setTimeout(busZeichnen, 90); };
new ResizeObserver(busNeu).observe(grid);
addEventListener('resize', busNeu);
requestAnimationFrame(busZeichnen);
if (document.fonts && document.fonts.ready) document.fonts.ready.then(busNeu);

/* ───────── Skalierung: Vorschau = verkleinerte Vollbildansicht ───────── */
const bar = $('#bar');
let W = 1280, H = 800, BAR = 58;
function measure(){
  BAR = bar.offsetHeight || 58;
  W = root.clientWidth;
  H = Math.max(240, window.innerHeight - BAR);
  root.style.setProperty('--W', W+'px');
  root.style.setProperty('--H', H+'px');
  tiles.forEach(t => { if (t !== anim) fit(t); });
  if (current && !busy) applyRect(current, target());
}
function fit(t){
  /* Skaliert wird nur noch das ausgeklappte Fenster – in der Kachel
     steckt jetzt das Zeichen, kein laufendes Fenster mehr. */
  if (t.frame.classList.contains('fixed')) t.vp.style.transform = `scale(${t.frame.clientWidth / W})`;
}
const ro = new ResizeObserver(() => tiles.forEach(t => { if (t !== anim && !t.frame.classList.contains('fixed')) fit(t); }));
tiles.forEach(t => ro.observe(t.shot));
addEventListener('resize', measure);

/* ───────── Zoom ───────── */
let current = null, busy = false, anim = null;
const target = () => ({ x:0, y:BAR, w:W, h:H, r:0 });
const fromShot = t => { const b = t.shot.getBoundingClientRect(); return { x:b.left, y:b.top, w:b.width, h:b.height, r:11 }; };
function applyRect(t, r){
  const s = t.frame.style;
  s.left = r.x+'px'; s.top = r.y+'px'; s.width = r.w+'px'; s.height = r.h+'px'; s.borderRadius = r.r+'px';
  t.vp.style.transform = `scale(${r.w / W})`;
}
function clearRect(t){ ['left','top','width','height','borderRadius'].forEach(k => t.frame.style[k] = ''); }
const ease = p => p < .5 ? 4*p*p*p : 1 - Math.pow(-2*p + 2, 3)/2;
function tween(t, a, b, dur, done){
  anim = t;
  const t0 = performance.now();
  const step = now => {
    const p = dur ? Math.min(1, (now - t0)/dur) : 1, e = ease(p);
    applyRect(t, { x:a.x+(b.x-a.x)*e, y:a.y+(b.y-a.y)*e, w:a.w+(b.w-a.w)*e, h:a.h+(b.h-a.h)*e, r:a.r+(b.r-a.r)*e });
    if (p < 1) requestAnimationFrame(step); else { anim = null; done && done(); }
  };
  requestAnimationFrame(step);
}
function setBar(t){
  $('#barIdx').textContent = pad2(t.i+1);
  $('#barName').textContent = t.app.name;
  $('#barTag').textContent = t.app.tag;
  $('#openBtn').href = t.app.url;
  document.title = t.app.name + ' · Kontor';
}
function focusApp(t, on){
  if (t.iframe) t.iframe.tabIndex = on ? 0 : -1;
  t.shot.setAttribute('aria-expanded', on ? 'true' : 'false');
}

function open(id, { push = true, animate = true } = {}){
  const t = byId[id];
  if (!t || busy) return;
  if (current === t) return;
  if (current) { swap(t, push); return; }
  busy = true; current = t;
  const a = fromShot(t);
  root.classList.add('locked');
  measure();
  t.frame.classList.add('fixed');
  applyRect(t, a);
  ensureLoaded(t);            /* erst sichtbar, dann laden – sonst bleibt der Rahmen in Safari leer */
  setBar(t);
  document.body.classList.add('zoomed');
  if (push) history.pushState({ cockpit:id }, '', '#'+id);
  tween(t, a, target(), animate ? DUR : 0, () => {
    t.frame.classList.add('live'); focusApp(t, true); busy = false;
    $('#backBtn').focus({ preventScroll:true });
  });
}

function close({ animate = true } = {}){
  if (!current || busy) return;
  const t = current; busy = true;
  t.frame.classList.remove('live'); focusApp(t, false);
  document.body.classList.remove('zoomed');
  tween(t, target(), fromShot(t), animate ? DUR : 0, () => {
    t.frame.classList.remove('fixed'); clearRect(t);
    root.classList.remove('locked');
    current = null; busy = false; fit(t);
    document.title = 'Kontor · Werkbank Unverricht';
    t.shot.focus({ preventScroll:true });
  });
}

function swap(t, push){
  const old = current;
  old.frame.classList.remove('live','fixed'); clearRect(old); focusApp(old, false); fit(old);
  current = t;
  t.frame.classList.add('fixed','live'); applyRect(t, target()); ensureLoaded(t); focusApp(t, true); setBar(t);
  if (!reduce) t.frame.animate([{ opacity:0, transform:'translateY(10px)' }, { opacity:1, transform:'none' }], { duration:260, easing:'cubic-bezier(.2,.8,.2,1)' });
  if (push) history.replaceState({ cockpit:t.id }, '', '#'+t.app.id);
}

function requestClose(){
  if (!current) return;
  if (history.state && history.state.cockpit) history.back();
  else { close(); history.replaceState(null, '', location.pathname + location.search); }
}
function step(dir){
  if (!current || busy) return;
  const n = tiles[(current.i + dir + tiles.length) % tiles.length];
  swap(n, true);
}

$('#backBtn').addEventListener('click', requestClose);
$('#scrim').addEventListener('click', requestClose);
$('#prevBtn').addEventListener('click', () => step(-1));
$('#nextBtn').addEventListener('click', () => step(1));
$('#home').addEventListener('click', e => { e.preventDefault(); if (current) requestClose(); else scrollTo({ top:0, behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth' }); });
addEventListener('keydown', e => {
  if (!current) return;
  if (e.key === 'Escape') requestClose();
  else if (e.altKey && e.key === 'ArrowRight') step(1);
  else if (e.altKey && e.key === 'ArrowLeft') step(-1);
});
addEventListener('popstate', () => {
  const id = location.hash.slice(1);
  if (byId[id]) open(id, { push:false }); else close();
});

/* ───────── Start ───────── */
measure();
if (document.fonts && document.fonts.ready) document.fonts.ready.then(measure);
const startId = location.hash.slice(1);
if (byId[startId]) {
  history.replaceState({ cockpit:null }, '', location.pathname + location.search);
  requestAnimationFrame(() => open(startId, { animate:false }));
}
})();
</script>
</body>
